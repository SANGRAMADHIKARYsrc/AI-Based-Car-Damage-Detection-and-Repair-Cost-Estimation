# Phase 5 — Damage Classification Experiment Configuration
# EfficientNet-B0 on CarDD 6-class localized damage crops

experiment:
  name: "phase5_damage_classifier_efficientnet_b0"
  phase: "5"
  date: "2026-10-04"
  researcher: "car-damage-ai"

dataset:
  name: "CarDD-Crops"
  version: "1.0"
  source: "data/Datasets"
  crop_dir: "data/processed/damage_crops"
  num_classes: 6
  classes: ['dent', 'scratch', 'crack', 'glass shatter', 'lamp broken', 'tire flat']
  padding_ratio: 0.15
  class_weights: [0.5882, 0.4940, 0.9797, 1.1469, 1.1247, 1.6665]  # smoothed sqrt

model:
  architecture: "EfficientNet-B0"
  backbone: "efficientnet_b0"
  pretrained: true
  num_classes: 6
  dropout_rate: 0.3
  hidden_dim: 256
  freeze_backbone: false

training:
  image_size: 224
  batch_size: 32
  epochs: 35
  patience: 8               # early stopping on val macro-F1
  learning_rate: 0.0003
  weight_decay: 0.0001
  optimizer: "AdamW"
  scheduler: "cosine_warmup"
  warmup_epochs: 3
  loss_function: "weighted_cross_entropy"
  label_smoothing: 0.05
  random_seed: 42
  amp: true
  workers: 2

hardware:
  gpu: "NVIDIA GeForce RTX 2050"
  vram: "4096 MiB"
  compute_capability: "8.6"

targets:
  val_macro_f1_target: 0.70
  test_accuracy_target: 0.72
  crack_f1_improvement_target: 0.45  # baseline detector had 0.3862 F1
